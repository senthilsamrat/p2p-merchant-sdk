name: Publish to npm

# Publishes @plantmewallet/merchant-sdk to npm with provenance attestation.
# Fires on a pushed tag matching v*.*.* or on manual dispatch from the
# Actions tab. Provenance requires id-token: write and a Trusted Publisher
# configured for this repo + workflow at npmjs.com.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (for example v0.3.0-beta.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual releases resolve the tag locally after fetching all refs.
          # This prevents a same-named mutable branch from satisfying the input.
          fetch-depth: 0

      - name: Resolve immutable release tag
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Release tag does not exist: $TAG"
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
          echo "Publishing immutable tag $TAG at $(git rev-parse HEAD)"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Invalid release tag: $TAG"; exit 1 ;;
          esac
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag ($TAG)"
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag $TAG"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck examples
        run: npm run typecheck:examples

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Publish to npm with provenance
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MAJOR_VERSION=${PKG_VERSION%%.*}
          if [ "$MAJOR_VERSION" = "0" ] || [[ "$PKG_VERSION" == *-* ]]; then
            DIST_TAG=beta
          else
            DIST_TAG=latest
          fi
          npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Print published version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Published @plantmewallet/merchant-sdk@$PKG_VERSION"
          echo "Install with: npm install @plantmewallet/merchant-sdk@$PKG_VERSION"
