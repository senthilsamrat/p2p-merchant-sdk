name: Publish to npm

# Publishes @plantmewallet/merchant-sdk to npm with provenance attestation.
# Fires on a pushed tag matching v*.*.* or on manual dispatch from the
# Actions tab. Provenance requires id-token: write and a Trusted Publisher
# configured for this repo + workflow at npmjs.com.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (use beta until 1.0 GA)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag ($TAG)"
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag $TAG"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck examples
        run: npm run typecheck:examples

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --tag ${{ inputs.tag || 'beta' }}

      - name: Print published version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Published @plantmewallet/merchant-sdk@$PKG_VERSION"
          echo "Install with: npm install @plantmewallet/merchant-sdk@${{ inputs.tag || 'beta' }}"
